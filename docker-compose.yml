version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: multitenant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8080-8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/multitenant
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update


volumes:
  pgdata: